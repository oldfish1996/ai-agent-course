<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI语音助手测试</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #edf1f5;
        --surface: #ffffff;
        --chat-bg: #f7f8fa;
        --border: #dce2e8;
        --text: #18212b;
        --muted: #697586;
        --primary: #176b5b;
        --primary-hover: #105548;
        --answer-bg: #e9eef2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        padding: 24px;
        color: var(--text);
        background: var(--page-bg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .chat-app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(860px, 100%);
        height: calc(100vh - 48px);
        min-height: 0;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 18px 48px rgb(33 44 58 / 12%);
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 70px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: var(--primary);
        font-size: 13px;
        font-weight: 700;
      }

      .header-copy {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        line-height: 1.35;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 20px;
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
      }

      #status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34a853;
        content: '';
      }

      #chat {
        min-height: 0;
        padding: 28px 54px;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--chat-bg);
        scroll-behavior: smooth;
      }

      #chat:empty::before {
        display: block;
        width: min(420px, 100%);
        margin: 18vh auto 0;
        color: var(--muted);
        text-align: center;
        content: '输入一个问题，开始与 AI 助手对话';
      }

      .question,
      .answer {
        position: relative;
        width: fit-content;
        max-width: min(72%, 600px);
        margin-bottom: 20px;
        padding: 11px 14px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        border: 1px solid var(--border);
        border-radius: 7px 7px 7px 2px;
        font-size: 15px;
        line-height: 1.65;
      }

      .question {
        margin-left: auto;
        border-color: var(--primary);
        border-radius: 7px 7px 2px;
        color: #fff;
        background: var(--primary);
      }

      .answer {
        margin-right: auto;
        padding-left: 14px;
        padding-right: 52px;
        background: var(--answer-bg);
      }

      .speech-indicator {
        position: absolute;
        top: 7px;
        right: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgb(23 107 91 / 18%);
        border-radius: 50%;
        color: var(--primary);
        background: #fff;
        cursor: pointer;
        box-shadow: 0 2px 8px rgb(23 107 91 / 10%);
      }

      .speech-indicator[hidden] {
        display: none;
      }

      .speech-indicator:hover,
      .speech-indicator:focus-visible {
        background: rgb(23 107 91 / 8%);
      }

      .speech-indicator span {
        width: 3px;
        height: 8px;
        border-radius: 3px;
        background: currentcolor;
        animation: none;
      }

      .speech-indicator.is-playing span {
        animation: speaking-bars 850ms ease-in-out infinite alternate;
      }

      .speech-indicator span:nth-child(2) {
        animation-delay: 180ms;
      }

      .speech-indicator span:nth-child(3) {
        animation-delay: 360ms;
      }

      .question::before,
      .answer::before {
        position: absolute;
        top: 50%;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #3f4b5c;
        font-size: 11px;
        font-weight: 700;
        transform: translateY(-50%);
      }

      .question::before {
        right: -40px;
        background: var(--primary);
        content: '你';
      }

      .answer::before {
        left: -40px;
        content: 'AI';
      }

      .composer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px 18px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      #query {
        min-width: 0;
        height: 46px;
        flex: 1;
        padding: 0 15px;
        border: 1px solid #c7ced8;
        border-radius: 6px;
        color: var(--text);
        background: #fff;
        outline: none;
      }

      #query:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgb(23 107 91 / 12%);
      }

      #voice-btn,
      #send-btn {
        height: 46px;
        padding: 0 22px;
        border: 1px solid var(--primary);
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      #voice-btn {
        color: var(--primary);
        background: #fff;
      }

      #tts-audio {
        width: min(220px, 100%);
        height: 36px;
      }

      #tts-audio[hidden] {
        display: none;
      }

      /* #voice-btn:hover:not(:disabled) {
        background: rgb(23 107 91 / 8%);
      } */

      #voice-btn.is-recording {
        /* color: #fff; */
        border-color: transparent;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(
              90deg,
              #00e5ff,
              #7c4dff,
              #ff4ecd,
              #ffe66d,
              #39ff88,
              #00e5ff
            )
            border-box;
        background-size:
          100% 100%,
          300% 100%;
        animation: recording-border 1.4s linear infinite;
      }

      #voice-btn.is-recording::before {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: currentcolor;
        content: '';
        animation: recording-dot 1s ease-in-out infinite;
      }

      #send-btn {
        color: #fff;
        background: var(--primary);
      }

      #send-btn:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      #voice-btn:disabled,
      #send-btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      @keyframes recording-border {
        0% {
          background-position:
            0 0,
            0% 0;
          box-shadow: 0 0 6px rgb(0 229 255 / 42%);
        }

        50% {
          box-shadow: 0 0 10px rgb(124 77 255 / 52%);
        }

        100% {
          background-position:
            0 0,
            100% 0;
          box-shadow: 0 0 6px rgb(255 78 205 / 42%);
        }
      }

      @keyframes recording-dot {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.35;
        }
      }

      @keyframes speaking-bars {
        from {
          height: 6px;
          opacity: 0.6;
        }

        to {
          height: 17px;
          opacity: 1;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 0;
        }

        .chat-app {
          width: 100%;
          height: 100vh;
          min-height: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .chat-header {
          padding-inline: 16px;
        }

        #chat {
          padding: 22px 54px;
        }

        .question,
        .answer {
          max-width: 88%;
        }

        .composer {
          padding: 12px;
        }

        #voice-btn,
        #send-btn {
          padding-inline: 17px;
        }

        #tts-audio:not([hidden]) {
          position: absolute;
          right: 12px;
          bottom: 78px;
          max-width: calc(100% - 24px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #chat {
          scroll-behavior: auto;
        }

        #voice-btn.is-recording,
        #voice-btn.is-recording::before,
        .speech-indicator span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat-app">
      <header class="chat-header">
        <div class="brand" aria-hidden="true">AI</div>
        <div class="header-copy">
          <h1>AI 语音助手</h1>
          <div id="status" role="status">在线，等待提问</div>
        </div>
      </header>

      <section id="chat" aria-live="polite"></section>

      <div class="composer">
        <input
          id="query"
          type="text"
          placeholder="输入问题发送或者语音输入"
          aria-label="输入问题"
        />
        <button id="voice-btn" type="button" aria-pressed="false">
          语音输入
        </button>
        <button id="send-btn" type="button">发送</button>
        <audio id="tts-audio" controls hidden aria-label="AI 回答语音"></audio>
      </div>
    </main>

    <script>
      const statusText = document.getElementById('status');
      const queryInput = document.getElementById('query');
      const sendBtn = document.getElementById('send-btn');

      const voiceBtn = document.getElementById('voice-btn');
      const ttsAudio = document.getElementById('tts-audio');

      const chat = document.getElementById('chat');

      let eventSource = null;
      let hasReceivedData = false;
      let isSending = false;
      let activeTts = null;

      function stopTts() {
        const session = activeTts;
        activeTts = null;
        if (session) {
          session.indicator.hidden = true;
          session.eventController.abort();
          session.socket.close();
          URL.revokeObjectURL(session.objectUrl);
        }
        ttsAudio.pause();
        ttsAudio.removeAttribute('src');
        ttsAudio.load();
        ttsAudio.hidden = true;
      }

      function setSpeechIndicator(session, playing) {
        session.indicator.hidden = false;
        session.indicator.classList.toggle('is-playing', playing);
        const label = playing ? '暂停朗读' : ttsAudio.ended ? '从头朗读' : '继续朗读';
        session.indicator.setAttribute('aria-label', label);
        session.indicator.title = label;
      }

      function pumpTtsAudio(session) {
        if (activeTts !== session || !session.sourceBuffer) return;
        if (session.sourceBuffer.updating || session.mediaSource.readyState !== 'open') return;

        if (session.chunks.length) {
          try {
            session.sourceBuffer.appendBuffer(session.chunks.shift());
          } catch (error) {
            console.error('音频追加失败', error);
            statusText.textContent = '语音播放失败，文字回答仍可查看';
            stopTts();
          }
        } else if (session.done) {
          session.mediaSource.endOfStream();
        }
      }

      async function openTtsSession(indicator) {
        const sessionId = crypto.randomUUID();
        const socketUrl = new URL('/speech/tts/ws', location.href);
        socketUrl.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socketUrl.searchParams.set('ttsSessionId', sessionId);

        const socket = new WebSocket(socketUrl);
        socket.binaryType = 'arraybuffer';
        const mediaSource = new MediaSource();
        const session = {
          id: sessionId,
          socket,
          mediaSource,
          objectUrl: URL.createObjectURL(mediaSource),
          indicator,
          eventController: new AbortController(),
          sourceBuffer: null,
          chunks: [],
          done: false,
          playStarted: false,
        };
        activeTts = session;
        ttsAudio.src = session.objectUrl;
        ttsAudio.addEventListener('playing', () => {
          if (activeTts === session) setSpeechIndicator(session, true);
        }, { signal: session.eventController.signal });
        ttsAudio.addEventListener('pause', () => {
          if (activeTts === session && !indicator.hidden) {
            setSpeechIndicator(session, false);
          }
        }, { signal: session.eventController.signal });
        ttsAudio.addEventListener('ended', () => {
          if (activeTts === session) setSpeechIndicator(session, false);
        }, { signal: session.eventController.signal });
        // 在用户点击“发送”的调用栈内请求播放，尽量保留浏览器的用户激活状态。
        void ttsAudio.play().catch(() => {
          if (activeTts === session) {
            ttsAudio.hidden = false;
            statusText.textContent = '点击音频播放器开始朗读';
          }
        });

        mediaSource.addEventListener('sourceopen', () => {
          if (activeTts !== session) return;
          try {
            session.sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
            session.sourceBuffer.addEventListener('updateend', () => {
              if (activeTts !== session) return;
              if (!session.playStarted && ttsAudio.buffered.length) {
                session.playStarted = true;
                void ttsAudio.play().catch(() => {
                  ttsAudio.hidden = false;
                  statusText.textContent = '点击音频播放器开始朗读';
                });
              }
              pumpTtsAudio(session);
            });
            pumpTtsAudio(session);
          } catch (error) {
            console.error('音频解码器初始化失败', error);
            statusText.textContent = '当前浏览器无法播放流式 MP3';
            stopTts();
          }
        });

        socket.onmessage = (event) => {
          if (activeTts !== session) return;
          if (event.data instanceof ArrayBuffer) {
            session.chunks.push(event.data);
            pumpTtsAudio(session);
            return;
          }
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'tts_done') {
              session.done = true;
              pumpTtsAudio(session);
            } else if (message.type === 'tts_error') {
              statusText.textContent = `语音合成失败：${message.message || message.error || '未知错误'}`;
              session.done = true;
              pumpTtsAudio(session);
            }
          } catch (error) {
            console.error('无法解析 TTS 消息', error);
          }
        };

        socket.onclose = () => {
          if (activeTts !== session) return;
          session.done = true;
          pumpTtsAudio(session);
        };

        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('语音连接超时')), 8000);
          socket.addEventListener('open', () => {
            clearTimeout(timer);
            resolve(sessionId);
          }, { once: true });
          socket.addEventListener('error', () => {
            clearTimeout(timer);
            reject(new Error('语音连接失败'));
          }, { once: true });
        });
      }

      function finish() {
        eventSource?.close();
        eventSource = null;
        isSending = false;
        sendBtn.disabled = false;
        voiceBtn.disabled = false;
        queryInput.focus();
      }

      async function sendQuery(value = queryInput.value) {
        const query = value.trim();
        if (!query || isSending) {
          return;
        }

        isSending = true;
        sendBtn.disabled = true;
        voiceBtn.disabled = true;
        hasReceivedData = false;
        queryInput.value = '';
        stopTts();

        const question = document.createElement('div');
        question.classList.add('question');
        question.textContent = query;
        chat.appendChild(question);
        chat.scrollTop = chat.scrollHeight;

        const answer = document.createElement('div');
        answer.classList.add('answer');
        const answerText = document.createElement('span');
        const indicator = document.createElement('button');
        indicator.classList.add('speech-indicator');
        indicator.type = 'button';
        indicator.hidden = true;
        indicator.setAttribute('aria-label', '停止朗读');
        indicator.title = '停止朗读';
        indicator.innerHTML = '<span></span><span></span><span></span>';
        indicator.addEventListener('click', () => {
          if (activeTts?.indicator !== indicator) return;
          if (!ttsAudio.paused) {
            ttsAudio.pause();
            setSpeechIndicator(activeTts, false);
            statusText.textContent = '已暂停朗读，点击图标可继续播放';
          } else {
            if (ttsAudio.ended) ttsAudio.currentTime = 0;
            void ttsAudio.play().catch(() => {
              ttsAudio.hidden = false;
              statusText.textContent = '点击音频播放器开始朗读';
            });
          }
        });
        answer.append(answerText, indicator);
        chat.appendChild(answer);

        let sessionId;
        if (window.MediaSource && MediaSource.isTypeSupported('audio/mpeg')) {
          try {
            sessionId = await openTtsSession(indicator);
          } catch (error) {
            console.error(error);
            stopTts();
            statusText.textContent = '语音连接失败，继续显示文字回答';
          }
        } else {
          statusText.textContent = '当前浏览器不支持流式 MP3，继续显示文字回答';
        }
        const params = new URLSearchParams({ query });
        if (sessionId) params.set('ttsSessionId', sessionId);
        eventSource = new EventSource(`/ai/chat/stream?${params}`);

        eventSource.onopen = () => {
          statusText.textContent = '正在生成回答...';
          answerText.textContent = '正在思考...';
        };

        eventSource.onmessage = (event) => {
          if (!hasReceivedData) {
            answerText.textContent = '';
            hasReceivedData = true;
          }
          answerText.textContent += event.data;
          chat.scrollTop = chat.scrollHeight;
        };

        eventSource.onerror = () => {
          if (!hasReceivedData) {
            answerText.textContent = '连接失败，请检查服务是否正常运行';
          }
          statusText.textContent = hasReceivedData
            ? '回答完成'
            : '连接失败，请检查服务是否正常运行';
          finish();
        };

        eventSource.addEventListener('done', () => {
          statusText.textContent = '回答完成';
          finish();
        });
      }

      sendBtn.addEventListener('click', () => {
        void sendQuery();
      });

      queryInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.isComposing) {
          sendBtn.click();
        }
      });

      const recordingFormats = [
        {
          mimeType: 'audio/ogg;codecs=opus',
          extension: 'ogg',
        },
        {
          mimeType: 'audio/mp4;codecs=mp4a.40.2',
          extension: 'm4a',
        },
        {
          mimeType: 'audio/mp4',
          extension: 'm4a',
        },
      ];

      let mediaRecorder = null;
      let mediaStream = null;
      let audioChunks = [];
      let isUploading = false;

      function releaseRecording() {
        mediaStream?.getTracks().forEach((track) => track.stop());
        mediaStream = null;
        mediaRecorder = null;
        audioChunks = [];
        isUploading = false;
        voiceBtn.textContent = '语音输入';
        voiceBtn.classList.remove('is-recording');
        voiceBtn.setAttribute('aria-pressed', 'false');
      }

      const recordVoice = async () => {
        if (
          !navigator.mediaDevices?.getUserMedia ||
          typeof MediaRecorder === 'undefined'
        ) {
          statusText.textContent = '当前浏览器不支持录音';
          return;
        }

        const format = recordingFormats.find(({ mimeType }) =>
          MediaRecorder.isTypeSupported(mimeType),
        );
        if (!format) {
          statusText.textContent = '当前浏览器不支持 OGG 或 MP4 录音';
          return;
        }

        voiceBtn.disabled = true;
        sendBtn.disabled = true;
        statusText.textContent = '正在请求麦克风权限...';

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          audioChunks = [];
          const recorder = new MediaRecorder(mediaStream, {
            mimeType: format.mimeType,
          });
          mediaRecorder = recorder;

          recorder.ondataavailable = (event) => {
            if (event.data?.size > 0) {
              audioChunks.push(event.data);
            }
          };

          recorder.onerror = (event) => {
            console.error('录音失败', event.error);
            statusText.textContent = '录音失败，请重试';
          };

          recorder.onstop = async () => {
            isUploading = true;
            statusText.textContent = '录音结束，正在上传...';
            let recognizedText = '';

            try {
              const mimeType = recorder.mimeType || format.mimeType;
              const blob = new Blob(audioChunks, { type: mimeType });
              if (!blob.size) {
                throw new Error('录音为空');
              }

              const formData = new FormData();
              formData.append('audio', blob, `record.${format.extension}`);

              const response = await fetch('/speech/asr', {
                method: 'POST',
                body: formData,
              });

              if (!response.ok) {
                const text = await response.text();
                throw new Error(`上传失败：${text}`);
              }

              const data = await response.json();
              recognizedText = String(data.text ?? '').trim();
              if (!recognizedText) {
                throw new Error('未识别到有效文字');
              }
              statusText.textContent = '识别完成，正在发送...';
            } catch (error) {
              console.error(error);
              statusText.textContent =
                error instanceof Error ? error.message : '录音识别失败';
            } finally {
              releaseRecording();
              sendBtn.disabled = false;
              voiceBtn.disabled = false;
            }

            if (recognizedText) {
              void sendQuery(recognizedText);
            }
          };

          recorder.start(250);
          voiceBtn.textContent = '结束并发送';
          voiceBtn.classList.add('is-recording');
          voiceBtn.setAttribute('aria-pressed', 'true');
          voiceBtn.disabled = false;
          statusText.textContent = '录音中';
        } catch (error) {
          console.error(error);
          releaseRecording();
          sendBtn.disabled = false;
          voiceBtn.disabled = false;
          statusText.textContent =
            error instanceof DOMException && error.name === 'NotAllowedError'
              ? '麦克风权限被拒绝'
              : '录音启动失败';
        }
      };

      const stopRecord = () => {
        if (mediaRecorder?.state !== 'recording') {
          return;
        }

        voiceBtn.disabled = true;
        voiceBtn.classList.remove('is-recording');
        voiceBtn.setAttribute('aria-pressed', 'false');
        mediaRecorder.stop();
        statusText.textContent = '正在结束录音...';
      };

      voiceBtn.addEventListener('click', () => {
        if (isUploading) {
          return;
        }

        if (mediaRecorder?.state === 'recording') {
          stopRecord();
        } else {
          void recordVoice();
        }
      });

      window.addEventListener('beforeunload', () => {
        eventSource?.close();
        stopTts();
        if (mediaRecorder?.state === 'recording') {
          mediaRecorder.stop();
        }
        mediaStream?.getTracks().forEach((track) => track.stop());
      });
    </script>
  </body>
</html>
