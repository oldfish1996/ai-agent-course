services:
  es:
    # image: elasticsearch:8.17.0
    build: ./elasticsearch # es + ik 分词
    container_name: es-dev
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node # 单节点模式
      - xpack.security.enabled=false # 禁用安全功能，免密码访问
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/es:/usr/share/elasticsearch/data # 挂载数据卷

  kibana:
    image: kibana:8.17.0
    container_name: kibana-dev
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    depends_on:
      - es
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/kibana:/usr/share/kibana/data # 挂载配置卷

networks:
  default:
    name: common-network
